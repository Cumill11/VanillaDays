<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logowanie – VanillaDays</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="https://cdn.kamilkowalczyk.pl/static/images/favicon/favicon.svg">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--outline);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 360px;
    }
    .login-brand {
      display: flex; align-items: center; gap: .6rem;
      justify-content: center; margin-bottom: 2rem;
      font-size: 1.2rem; font-weight: 500; color: var(--on-surface);
    }
    .login-card h1 { font-size: 1.1rem; font-weight: 500; color: var(--on-surface); margin-bottom: 1.5rem; text-align: center; }
    .login-error {
      background: rgba(239,83,80,.12); border: 1px solid rgba(239,83,80,.4);
      color: #EF9A9A; border-radius: 8px; padding: .7rem 1rem;
      font-size: .85rem; margin-bottom: 1rem;
      display: flex; align-items: center; gap: .5rem;
    }
    .login-submit { width: 100%; margin-top: 1.25rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <img src="/static/logo.svg" alt="VanillaDays" style="width:2rem;height:2rem">
      VanillaDays
    </div>

    {% if error %}
    <div class="login-error">
      <span class="material-symbols-rounded" style="font-size:1rem">error</span>
      {{ error }}
    </div>
    {% endif %}

    <form method="post">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label class="field-label">Nazwa użytkownika</label>
        <input type="text" name="username" class="field-input" autofocus autocomplete="username" required>
      </div>
      <div class="field">
        <label class="field-label">Hasło</label>
        <input type="password" name="password" class="field-input" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-filled login-submit">Zaloguj się</button>
    </form>
  </div>
</body>
</html>
